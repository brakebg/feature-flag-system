<!doctype html>
<!--
  Design 1 · Sign in. Updated 2026-10-13 to match the built UI (frontend/src, v1.1.0).
  Plain HTML and CSS: read the exact values below. Names and texts in the markup are sample data.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Tokens: same names and values as frontend/src/styles/tokens.css */
  :root {
    --color-bg: #f4f5f7;
    --color-surface: #ffffff;
    --color-text: #15181d;
    --color-text-muted: #59616c;
    --color-border: #dce0e5;
    --color-border-strong: #c7cdd4;
    --color-primary: #2350c8;
    --color-primary-dark: #1a3d9c;
    --color-info-bg: #eef3fd;
    --color-topbar: #15181d;
    --color-danger: #a8231a;
    --color-danger-soft: #fbeae8;
    --font-sans: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    --radius: 6px;
    --radius-md: 8px;
    --radius-xl: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); font-size: 14px; }

  .page { min-height: 100vh; padding: 24px; display: flex; align-items: center; justify-content: center; }
  .column { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 18px; }
  .logo { width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--color-topbar); display: flex; align-items: center; justify-content: center; }
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: 32px; display: flex; flex-direction: column; gap: 20px; }
  .heading { display: flex; flex-direction: column; gap: 6px; }
  .title { margin: 0; font-size: 22px; font-weight: 600; }
  .subtitle { margin: 0; color: var(--color-text-muted); }
  /* Info banner, shown for /login?expired=1 */
  .info { display: flex; gap: 10px; padding: 12px; border-radius: var(--radius-md); background: var(--color-info-bg); color: var(--color-primary-dark); font-size: 13px; }
  .info svg { flex-shrink: 0; margin-top: 1px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .label { font-weight: 500; }
  .input { height: 44px; padding: 0 12px; border: 1px solid var(--color-border-strong); border-radius: var(--radius); font: inherit; color: var(--color-text); }
  /* Error message (role="alert"), between the fields and the button. Not shown in this state. */
  .error { padding: 10px 12px; border-radius: var(--radius-md); background: var(--color-danger-soft); color: var(--color-danger); font-size: 13px; }
  .submit { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; width: 100%; padding: 0; border: 0; border-radius: var(--radius); background: var(--color-primary); color: #ffffff; font: inherit; cursor: pointer; }
  .submit:disabled { opacity: 0.75; cursor: progress; }
</style>
</head>
<body>
<div class="page">
  <div class="column">
    <div class="brand">
      <span class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>
      </span>
      <span>Feature Flags</span>
    </div>
    <form class="card" novalidate>
      <div class="heading">
        <h1 class="title">Sign in</h1>
        <p class="subtitle">Use your admin credentials to manage flags.</p>
      </div>
      <div role="status" class="info">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        <span>Your session expired. Please sign in again.</span>
      </div>
      <div class="field">
        <label for="username" class="label">Username</label>
        <input id="username" type="text" class="input" value="admin">
      </div>
      <div class="field">
        <label for="password" class="label">Password</label>
        <input id="password" type="password" class="input" value="password">
      </div>
      <button type="submit" class="submit">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
