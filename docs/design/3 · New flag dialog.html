<!doctype html>
<!--
  Design 3 · New flag dialog. Updated 2026-10-13 to match the built UI (frontend/src, v1.1.0).
  Plain HTML and CSS: read the exact values below. Names and texts in the markup are sample data.
  The other form dialogs (New group, Edit group, Edit flag) use the same Modal and TextField styles.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New flag dialog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Tokens: same names and values as frontend/src/styles/tokens.css */
  :root {
    --color-bg: #f4f5f7;
    --color-surface: #ffffff;
    --color-surface-muted: #f8f9fa;
    --color-text: #15181d;
    --color-text-muted: #59616c;
    --color-border: #dce0e5;
    --color-border-strong: #c7cdd4;
    --color-primary: #2350c8;
    --color-danger: #a8231a;
    --color-switch-off: #aab2bd;
    --color-overlay: rgba(59, 66, 76, 0.75);
    --font-sans: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --radius: 6px;
    --radius-md: 8px;
    --radius-xl: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); font-size: 14px; }

  /* Modal */
  .overlay { position: fixed; inset: 0; z-index: 20; padding: 24px; background: var(--color-overlay); display: flex; align-items: center; justify-content: center; }
  .dialog { width: 100%; max-width: 520px; max-height: calc(100vh - 48px); overflow: auto; background: var(--color-surface); border-radius: var(--radius-xl); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--color-border); }
  .title { margin: 0; font-size: 18px; font-weight: 600; }
  .close { width: 36px; height: 36px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; padding: 0; border: 0; background: transparent; cursor: pointer; }
  .body { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .footer { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--color-border); background: var(--color-surface-muted); border-radius: 0 0 var(--radius-xl) var(--radius-xl); }

  /* TextField */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .label { font-weight: 500; }
  .optional { font-weight: 400; color: var(--color-text-muted); }
  .input { height: 44px; padding: 0 12px; border: 1px solid var(--color-border-strong); border-radius: var(--radius); font: inherit; color: var(--color-text); background: var(--color-surface); }
  textarea.input { height: auto; padding: 10px 12px; resize: vertical; }
  .input[aria-invalid='true'] { border-color: var(--color-danger); }
  .mono { font-family: var(--font-mono); font-size: 14px; }
  .prefixed { display: flex; height: 44px; border: 1px solid var(--color-border-strong); border-radius: var(--radius); overflow: hidden; }
  .prefix { display: flex; align-items: center; padding: 0 10px; background: var(--color-bg); border-right: 1px solid var(--color-border-strong); font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); }
  .joined { flex-grow: 1; min-width: 0; height: 100%; border: 0; border-radius: 0; }
  .help { font-size: 13px; color: var(--color-text-muted); }
  /* Field error text (aria-describedby). Not shown in this state. */
  .error { font-size: 13px; color: var(--color-danger); }
  .counter { font-size: 13px; color: var(--color-text-muted); text-align: right; }

  /* Initial state box */
  .initial { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; border: 1px solid var(--color-border); border-radius: var(--radius-md); }
  .initial-text { display: flex; flex-direction: column; gap: 2px; }
  .initial-label { font-weight: 500; }
  .initial-help { font-size: 13px; color: var(--color-text-muted); }
  .switch-row { display: flex; align-items: center; gap: 10px; }
  .on { font-weight: 600; color: var(--color-text); }
  .off { font-weight: 600; color: var(--color-text-muted); }

  /* Switch (button role="switch") */
  .track { position: relative; width: 44px; height: 24px; padding: 0; border: 0; border-radius: 999px; background: var(--color-switch-off); cursor: pointer; flex-shrink: 0; }
  .track[aria-checked='true'] { background: var(--color-primary); }
  .knob { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 999px; background: #ffffff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transition: transform 0.15s; }
  .track[aria-checked='true'] .knob { transform: translateX(20px); }

  /* Buttons */
  .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--radius); font: inherit; cursor: pointer; }
  .button.primary { border: 0; background: var(--color-primary); color: #ffffff; }
  .button.secondary { border: 1px solid var(--color-border-strong); background: var(--color-surface); color: var(--color-text); }
</style>
</head>
<body>
<div class="overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="header">
      <h2 class="title" id="dialog-title">New flag in Orders</h2>
      <button type="button" class="close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B424C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <form class="body" novalidate>
      <div class="field">
        <label for="flag-key" class="label">Key</label>
        <div class="prefixed">
          <span class="prefix">orders.</span>
          <input id="flag-key" class="input mono joined" value="free-shipping-banner" aria-describedby="flag-key-help">
        </div>
        <span id="flag-key-help" class="help">Lowercase letters, digits and hyphens, 2 to 50 characters. Cannot be changed later.</span>
      </div>
      <div class="field">
        <label for="flag-description" class="label">Description <span class="optional">(optional)</span></label>
        <textarea id="flag-description" class="input" rows="3">Show the free shipping banner on the cart page</textarea>
        <span class="counter">46 / 500</span>
      </div>
      <div class="initial">
        <div class="initial-text">
          <span id="initial-label" class="initial-label">Initial state</span>
          <span class="initial-help">Off: services read false until you turn it on.</span>
        </div>
        <div class="switch-row">
          <button type="button" class="track" role="switch" aria-checked="false" aria-labelledby="initial-label"><span class="knob"></span></button>
          <span class="off">Off</span>
        </div>
      </div>
    </form>
    <div class="footer">
      <button type="button" class="button secondary">Cancel</button>
      <button type="submit" class="button primary">Create flag</button>
    </div>
  </div>
</div>
</body>
</html>
