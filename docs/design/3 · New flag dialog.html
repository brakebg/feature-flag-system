<!doctype html>
<!--
  Spec 005 · design 3 · New flag dialog. Redesign C, balanced colours.
  Plain HTML and CSS: read the exact values below.
  The Google Fonts link is only for viewing this file; the app bundles the fonts (spec 001 section 10.2). Names and texts in the markup are sample data.
  New group, Edit group and Edit flag use the same dialog, field and button styles (design 6 shows Edit flag).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New flag dialog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Tokens: spec 005 section 4.2 */
  :root {
    --color-bg: #f1f2f4;
    --color-surface: #ffffff;
    --color-text: #1c2433;
    --color-text-soft: #3d4556;
    --color-text-muted: #5b6475;
    --color-border: #dde0e6;
    --color-primary: #3d59a8;
    --color-primary-dark: #2d4486;
    --color-primary-soft: #dfe5f3;
    --color-ink: #1c2433;
    --color-sage: #8fb3a6;
    --color-apricot: #e8a87c;
    --color-danger: #b5473a;
    --color-danger-text: #9a3a2f;
    --color-switch-off: #cdd2db;
    --color-overlay: rgba(28, 36, 51, 0.62);
    --font-sans: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    --font-display: 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --radius-chip: 11px;
    --radius-field: 16px;
    --radius-row: 22px;
    --radius-dialog: 36px;
    --radius-pill: 999px;
    --shadow-dialog: 0 24px 60px rgba(28, 36, 51, 0.35);
    --shadow-knob: 0 1px 3px rgba(28, 36, 51, 0.25);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); font-size: 14px; }

  /* Modal */
  .overlay { position: fixed; inset: 0; padding: 24px; background: var(--color-overlay); display: flex; align-items: center; justify-content: center; }
  .dialog { position: relative; width: 100%; max-width: 560px; max-height: calc(100vh - 48px); overflow: auto; background: var(--color-surface); border-radius: var(--radius-dialog); box-shadow: var(--shadow-dialog); display: flex; flex-direction: column; }
  /* Decorative quarter circle in the top-right corner (aria-hidden) */
  .corner { position: absolute; top: 0; right: 0; width: 112px; height: 112px; border-radius: 0 0 0 112px; background: var(--color-sage); }
  .close { position: absolute; top: 18px; right: 18px; width: 44px; height: 44px; border: 0; border-radius: var(--radius-pill); background: var(--color-surface); color: var(--color-text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .header { padding: 32px 140px 8px 32px; }
  .title { margin: 0; font-family: var(--font-display); font-size: 32px; font-weight: 600; line-height: 1.1; overflow-wrap: anywhere; }
  .body { padding: 20px 32px 8px; display: flex; flex-direction: column; gap: 22px; }
  .footer { display: flex; justify-content: flex-end; gap: 10px; padding: 20px 32px 28px; }

  /* Fields */
  .field { display: flex; flex-direction: column; gap: 8px; }
  .label { font-weight: 500; }
  .optional { font-weight: 400; color: var(--color-text-muted); }
  .input { height: 52px; padding: 0 18px; border: 1.5px solid var(--color-border); border-radius: var(--radius-field); background: var(--color-surface); font: inherit; font-size: 15px; color: var(--color-text); }
  textarea.input { height: auto; padding: 14px 16px; resize: vertical; }
  .input[aria-invalid='true'], .prefixed.invalid { border-color: var(--color-danger); }
  .prefixed { display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 6px; border: 1.5px solid var(--color-border); border-radius: var(--radius-field); }
  .prefix { padding: 7px 12px; border-radius: var(--radius-chip); background: var(--color-bg); font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); }
  .joined { flex-grow: 1; min-width: 0; height: 100%; border: 0; padding: 0 8px; background: transparent; font-family: var(--font-mono); font-size: 15px; color: var(--color-text); }
  .help { font-size: 13px; color: var(--color-text-muted); }
  .error { font-size: 13px; color: var(--color-danger-text); }
  .counter { align-self: flex-end; font-size: 13px; color: var(--color-text-muted); }

  /* Initial state box */
  .initial { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 18px; border-radius: var(--radius-row); background: var(--color-bg); }
  .initial-text-row { display: flex; align-items: center; gap: 14px; }
  /* Decorative state shape: ring when off, filled circle (primary) when on */
  .state-shape { width: 36px; height: 36px; flex-shrink: 0; border-radius: var(--radius-pill); border: 3px solid var(--color-ink); }
  .state-shape.on { border: 0; background: var(--color-primary); }
  .initial-text { display: flex; flex-direction: column; gap: 2px; }
  .initial-label { font-weight: 600; }
  .initial-help { font-size: 13px; color: var(--color-text-muted); }
  .switch-row { display: flex; align-items: center; gap: 10px; }
  .state { font-weight: 600; }
  .state.off { color: var(--color-text-muted); }

  /* Switch */
  .track { position: relative; width: 54px; height: 30px; flex-shrink: 0; padding: 0; border: 0; border-radius: var(--radius-pill); background: var(--color-switch-off); cursor: pointer; }
  .track[aria-checked='true'] { background: var(--color-primary); }
  .knob { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: var(--radius-pill); background: #ffffff; box-shadow: var(--shadow-knob); transition: transform 0.15s; }
  .track[aria-checked='true'] .knob { transform: translateX(24px); box-shadow: none; }

  /* Buttons */
  .button { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 22px; border-radius: var(--radius-pill); font: inherit; font-weight: 500; cursor: pointer; }
  .button.primary { padding: 0 26px; border: 0; background: var(--color-primary); color: #ffffff; font-weight: 600; }
  .button.secondary { border: 1.5px solid var(--color-border); background: var(--color-surface); color: var(--color-text); }

  :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .knob { transition: none; } }
</style>
</head>
<body>
<div class="overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <span class="corner" aria-hidden="true"></span>
    <button type="button" class="close" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="header"><h2 class="title" id="dialog-title">New flag in Orders</h2></div>
    <form class="body" novalidate>
      <div class="field">
        <label for="flag-key" class="label">Key</label>
        <div class="prefixed">
          <span class="prefix">orders.</span>
          <input id="flag-key" class="joined" value="free-shipping-banner" aria-describedby="flag-key-help">
        </div>
        <span id="flag-key-help" class="help">Lowercase letters, digits and hyphens, 2 to 50 characters. Cannot be changed later.</span>
      </div>
      <div class="field">
        <label for="flag-description" class="label">Description <span class="optional">(optional)</span></label>
        <textarea id="flag-description" class="input" rows="3">Show the free shipping banner on the cart page</textarea>
        <span class="counter">46 / 500</span>
      </div>
      <div class="initial">
        <div class="initial-text-row">
          <span class="state-shape" aria-hidden="true"></span>
          <div class="initial-text">
            <span id="initial-label" class="initial-label">Initial state</span>
            <span class="initial-help">Off: services read false until you turn it on.</span>
          </div>
        </div>
        <div class="switch-row">
          <button type="button" class="track" role="switch" aria-checked="false" aria-labelledby="initial-label"><span class="knob"></span></button>
          <span class="state off">Off</span>
        </div>
      </div>
    </form>
    <div class="footer">
      <button type="button" class="button secondary">Cancel</button>
      <button type="submit" class="button primary">Create flag</button>
    </div>
  </div>
</div>
</body>
</html>
