- banner:
    - text: Feature Flags
    - navigation "Main":
        - link "Flags":
            - /url: /groups
        - link "Audit log":
            - /url: /audit
    - text: admin
    - button "Sign out"
- main:
    - heading "Audit log" [level=1]
    - paragraph: Every change to groups and flags, newest first.
    - text: Filter by target key
    - searchbox "Filter by target key"
    - table "Audit events":
        - rowgroup:
            - row "Time Actor Action Target Details":
                - columnheader "Time"
                - columnheader "Actor"
                - columnheader "Action"
                - columnheader "Target"
                - columnheader "Details"
        - rowgroup:
            - row /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago) admin Flag created notifications\.quiet-hours Created on/:
                - cell /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago)/
                - cell "admin"
                - cell "Flag created"
                - cell "notifications.quiet-hours"
                - cell "Created on"
            - row /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago) admin Flag created notifications\.sms-shipping-updates Created on/:
                - cell /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago)/
                - cell "admin"
                - cell "Flag created"
                - cell /notifications\.sms-shipping-updates/
                - cell "Created on"
            - row /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago) admin Flag created notifications\.push-digest Created off/:
                - cell /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago)/
                - cell "admin"
                - cell "Flag created"
                - cell "notifications.push-digest"
                - cell "Created off"
            - 'row /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago) admin Group created notifications Name: Notifications/':
                - cell /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago)/
                - cell "admin"
                - cell "Group created"
                - cell "notifications"
                - 'cell "Name: Notifications"'
            - row /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago) admin Flag created search\.typo-tolerance Created on/:
                - cell /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago)/
                - cell "admin"
                - cell "Flag created"
                - cell "search.typo-tolerance"
                - cell "Created on"
            - row /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago) admin Flag created search\.semantic-search Created off/:
                - cell /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago)/
                - cell "admin"
                - cell "Flag created"
                - cell "search.semantic-search"
                - cell "Created off"
            - 'row /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago) admin Group created search Name: Search/':
                - cell /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago)/
                - cell "admin"
                - cell "Group created"
                - cell "search"
                - 'cell "Name: Search"'
            - row /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago) admin Flag created payments\.crypto-checkout Created off/:
                - cell /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago)/
