            - row /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago) admin Flag created orders\.guest-reorder Created off/:
                - cell /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago)/
                - cell "admin"
                - cell "Flag created"
