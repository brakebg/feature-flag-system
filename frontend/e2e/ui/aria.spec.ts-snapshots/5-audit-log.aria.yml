            - row /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago) admin Flag created orders\.order-tracking-v2 Created on/:
                - cell /\d+\/\d+\/\d+, \d+:\d+:\d+ [AP]M (?:just now|\d+ (?:second|minute|hour|day|month|year)s? ago)/
