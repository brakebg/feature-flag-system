# nginx template (spec 10.2). ${BACKEND_URL} is filled in by envsubst at container start.
# HSTS only when the request arrived over HTTPS at the ingress; an empty value is not sent.
map $http_x_forwarded_proto $hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    include /etc/nginx/security-headers.conf;

    location /api/ {
        proxy_pass ${BACKEND_URL};
        # IF-2: the backend host stays the upstream's own (an ingress can route by it); the
        # browser's host with its port goes in X-Forwarded-Host, so CORS sees the same origin.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_ssl_server_name on;
        # IF-3: bodies above 64 KB get the 9.1 problem detail, the same as from the backend.
        client_max_body_size 64k;
        error_page 413 = @payload_too_large;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Each header appears exactly once: drop the backend's copies.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        include /etc/nginx/security-headers.conf;
    }

    location @payload_too_large {
        default_type application/problem+json;
        include /etc/nginx/security-headers.conf;
        return 413 '{"type":"https://featureflags.local/problems/payload-too-large","title":"Payload too large","status":413,"detail":"Request body is larger than 65536 bytes"}';
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        include /etc/nginx/security-headers.conf;
    }
}
