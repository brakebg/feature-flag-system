# CI (spec 10.5): the same command as the builder, `make verify-all`, with Docker.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install UI dependencies
        working-directory: frontend
        run: npm install -g npm@11.19.1 --no-audit --no-fund && npm ci --no-audit --no-fund
      - name: make verify-all
        run: make verify-all
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          if-no-files-found: ignore
          path: |
            build/verify-report.md
            build/verify-report.json
            build/traceability.md
            build/logs/
            backend/target/site/jacoco/
            backend/target/pit-reports/
            frontend/playwright-report/
            frontend/coverage/
