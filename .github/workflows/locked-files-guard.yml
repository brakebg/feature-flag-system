# Alerts on a PR to main that changes an owner-only path (scripts/locked-paths.txt).
# It does NOT block the merge: it posts (or updates) one PR comment and a warning, and the
# job always passes. The hard check is scripts/owner-review.sh, run by the owner before
# every merge.
#
# Safety (pull_request_target runs with this repo's token, so it must never run PR code):
# - The workflow file and scripts/locked-paths.txt always come from main, never from the PR.
# - No actions are used and nothing from the PR is checked out or executed; the PR is only
#   fetched as git objects and compared with `git log`.
# - Untrusted PR text (branch name, title, body, commit messages) is never put into a shell
#   command or into the comment; the comment lists only paths from main's list, commit
#   hashes and spec-* tag names that match a fixed pattern (spec flow split, spec-flow.md).
# - Token permissions: contents read, pull-requests write (to comment). No secrets.
name: locked-files-guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  locked-files-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      MARKER: "<!-- locked-files-guard -->"
    steps:
      - name: Compare locked paths with main
        run: |
          set -euo pipefail
          git init -q guard && cd guard
          git remote add origin "https://github.com/${REPO}.git"
          git fetch -q --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head" \
            "+refs/tags/spec-*:refs/tags/spec-*"

          git show origin/main:scripts/locked-paths.txt > ../locked-paths.txt
          base=$(git merge-base origin/main pr/head)
          range="${base}..pr/head"

          # Spec flow (docs/process/spec-flow.md): commits up to the newest spec-NNN-ready tag in
          # this PR are the approved spec; a commit tagged spec-NNN-amend-<k> is an owner
          # amendment; every other commit is the builder's. Tag names come from this repo and must
          # match the pattern below; nothing from the PR text is used.
          # Only the ready tags of the specs this PR changes count (a merged second spec does not).
          ready=""; missing=""
          for n in $(git diff --name-only "$base" pr/head -- docs/specs | sed -nE 's#^docs/specs/([0-9]{3})-.*#\1#p' | sort -u); do
            t="spec-${n}-ready"
            git rev-parse -q --verify "refs/tags/$t" >/dev/null || continue
            if ! c=$(git rev-parse -q --verify "$t^{commit}"); then missing="$missing \`$t\` (not a commit)"; continue; fi
            if ! git merge-base --is-ancestor "$c" pr/head; then missing="$missing \`$t\`"; continue; fi
            git merge-base --is-ancestor "$c" origin/main && continue
            if [ -n "$ready" ]; then missing="$missing \`$t\` (a second spec in this PR)"; continue; fi
            ready="$t"
          done
          spec_commits=""; amend_commits=""; amend_tags=""
          if [ -n "$ready" ]; then
            spec_commits=$(git rev-list "${base}..${ready}^{commit}")
            for t in $(git tag -l "${ready%-ready}-amend-*"); do
              [[ "$t" =~ ^spec-[0-9]{3}-amend-[0-9]+$ ]] || continue
              if ! c=$(git rev-parse -q --verify "$t^{commit}"); then missing="$missing \`$t\` (not a commit)"; continue; fi
              if git merge-base --is-ancestor "$ready" "$c" && git merge-base --is-ancestor "$c" pr/head; then
                amend_commits="$amend_commits $c"; amend_tags="$amend_tags \`$t\`"
              fi
            done
          fi
          # The newest owner version: the last amendment, else the ready commit, else main's base.
          # A locked file that no builder commit explains must hold that version, or that version
          # merged with the main commit the branch last took in (the allowed main merge). This
          # catches a merge that brings back an older owner version: git log then shows only the
          # old owner commit (security review).
          tip="$base"
          if [ -n "$ready" ]; then
            tip=$(git rev-parse "${ready}^{commit}")
            for c in $amend_commits; do
              if git merge-base --is-ancestor "$tip" "$c"; then tip="$c"
              elif ! git merge-base --is-ancestor "$c" "$tip"; then missing="$missing amend tags not in one line"; fi
            done
          fi
          merged=$(git merge-tree --write-tree "$tip" "$base" || true); merged="${merged%%$'\n'*}"

          : > ../spec.md; : > ../amend.md; : > ../builder.md
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            path="${line%% *}"
            if [ "$line" != "$path" ] && [ "${line##* }" = "create-once" ]; then
              commits=$(git log -M --format='%H' --diff-filter=MDR "$range" -- ":(glob)$path")
            else
              commits=$(git log -M --format='%H' "$range" -- ":(glob)$path")
            fi
            s=""; a=""; b=""
            for c in $commits; do
              short=$(git rev-parse --short "$c")
              if printf '%s\n' "$spec_commits" | grep -qx "$c"; then s="$s $short"
              elif printf '%s\n' $amend_commits | grep -qx "$c"; then a="$a $short"
              else b="$b $short"; fi
            done
            [ -n "$s" ] && printf -- '- `%s` — commits:%s\n' "$path" "$s" >> ../spec.md
            [ -n "$a" ] && printf -- '- `%s` — commits:%s\n' "$path" "$a" >> ../amend.md
            # A merge can change a file without any commit touching it, or bring back an older
            # owner version: compare the content with the newest owner version too.
            if [ -z "$b" ] && ! git diff --quiet "$tip" pr/head -- ":(glob)$path" \
              && ! { [ -n "$merged" ] && git diff --quiet "$merged" pr/head -- ":(glob)$path"; } \
              && ! { [ "$line" != "$path" ] && [ -z "$(git ls-tree -r --name-only "$tip" -- ":(glob)$path")" ]; }; then
              b=" (content differs from the newest owner version: changed through a merge)"
            fi
            if [ -n "$b" ]; then
              echo "::warning title=Locked path changed::$path"
              printf -- '- `%s` — commits:%s\n' "$path" "$b" >> ../builder.md
            fi
          done < ../locked-paths.txt
          printf '%s' "$ready" > ../ready.txt
          printf '%s' "$amend_tags" > ../amend-tags.txt
          printf '%s' "$missing" > ../missing.txt

      - name: Post or update the PR comment
        run: |
          set -euo pipefail
          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -1)
          ready=$(cat ready.txt); amend_tags=$(cat amend-tags.txt); missing=$(cat missing.txt)

          if [ -s builder.md ] || [ -s spec.md ] || [ -s amend.md ] || [ -n "$missing" ]; then
            {
              echo "${MARKER}"
              if [ -n "$missing" ]; then
                echo "### ⛔ Spec tag problem:${missing}"
                echo
                echo "The approved spec commit is not in this PR's history, a tag is not a commit, or the PR holds a second spec. Review every change."
                echo
              fi
              if [ -s spec.md ]; then
                echo "### ✅ Approved spec (up to \`${ready}\`): expected owner changes"
                echo; cat spec.md; echo
              fi
              if [ -s amend.md ]; then
                echo "### ✅ Owner amendments (${amend_tags# }): expected"
                echo; cat amend.md; echo
              fi
              if [ -s builder.md ]; then
                if [ -n "$ready" ]; then echo "### ⚠️ Locked files changed after \`${ready}\`: check these"
                else echo "### ⚠️ Locked files changed"; fi
                echo
                echo "Owner-only paths (\`scripts/locked-paths.txt\` on \`main\`):"
                echo
                cat builder.md
                echo
                echo "Run \`scripts/owner-review.sh\` and do not merge until each one is explained."
              fi
            } > body.md
          elif [ -n "$existing" ]; then
            printf '%s\n### ✅ Locked files: no changes\n\nAn earlier push changed owner-only paths; the current PR no longer does.\n' "${MARKER}" > body.md
          else
            echo "No locked path changed."
            exit 0
          fi

          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" -F body=@body.md >/dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@body.md >/dev/null
          fi
          echo "PR comment updated."
