# Alerts on a PR to main that changes an owner-only path (scripts/locked-paths.txt).
# It does NOT block the merge: it posts (or updates) one PR comment and a warning, and the
# job always passes. The hard check is scripts/owner-review.sh, run by the owner before
# every merge.
#
# Safety (pull_request_target runs with this repo's token, so it must never run PR code):
# - The workflow file and scripts/locked-paths.txt always come from main, never from the PR.
# - No actions are used and nothing from the PR is checked out or executed; the PR is only
#   fetched as git objects and compared with `git log`.
# - Untrusted PR text (branch name, title, body, commit messages) is never put into a shell
#   command or into the comment; the comment lists only paths from main's list and commit
#   hashes.
# - Token permissions: contents read, pull-requests write (to comment). No secrets.
name: locked-files-guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  locked-files-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      MARKER: "<!-- locked-files-guard -->"
    steps:
      - name: Compare locked paths with main
        run: |
          set -euo pipefail
          git init -q guard && cd guard
          git remote add origin "https://github.com/${REPO}.git"
          git fetch -q --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

          git show origin/main:scripts/locked-paths.txt > ../locked-paths.txt
          base=$(git merge-base origin/main pr/head)
          range="${base}..pr/head"
          : > ../findings.md

          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            path="${line%% *}"
            if [ "$line" != "$path" ] && [ "${line##* }" = "create-once" ]; then
              commits=$(git log -M --format='%h' --diff-filter=MDR "$range" -- ":(glob)$path" | tr '\n' ' ')
            else
              commits=$(git log -M --format='%h' "$range" -- ":(glob)$path" | tr '\n' ' ')
            fi
            if [ -n "$commits" ]; then
              echo "::warning title=Locked path changed::$path"
              printf -- '- `%s` — commits: %s\n' "$path" "$commits" >> ../findings.md
            fi
          done < ../locked-paths.txt

      - name: Post or update the PR comment
        run: |
          set -euo pipefail
          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -1)

          if [ -s findings.md ]; then
            {
              echo "${MARKER}"
              echo "### ⚠️ Locked files changed"
              echo
              echo "This PR changes owner-only paths (\`scripts/locked-paths.txt\` on \`main\`):"
              echo
              cat findings.md
              echo
              echo "Expected only for the owner's own spec changes. For a builder PR, run"
              echo "\`scripts/owner-review.sh\` and do not merge until this is explained."
            } > body.md
          elif [ -n "$existing" ]; then
            printf '%s\n### ✅ Locked files: no changes\n\nAn earlier push changed owner-only paths; the current PR no longer does.\n' "${MARKER}" > body.md
          else
            echo "No locked path changed."
            exit 0
          fi

          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" -F body=@body.md >/dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@body.md >/dev/null
          fi
          echo "PR comment updated."
