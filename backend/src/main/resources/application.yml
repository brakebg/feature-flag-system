spring:
  application:
    name: feature-flag-service
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${FF_DB_URL:jdbc:postgresql://localhost:5432/featureflags}
    username: ${FF_DB_USER:featureflags}
    password: ${FF_DB_PASSWORD:featureflags}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    git:
      mode: simple
