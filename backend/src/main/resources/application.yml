spring:
  application:
    name: feature-flag-service
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${FF_DB_URL:jdbc:postgresql://localhost:5432/featureflags}
    username: ${FF_DB_USER:featureflags}
    password: ${FF_DB_PASSWORD:featureflags}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration/common

featureflags:
  auth:
    admin-username: ${FF_ADMIN_USERNAME:admin}
    admin-password: ${FF_ADMIN_PASSWORD:admin123}   # dev default only
    jwt-secret: ${FF_JWT_SECRET:change-me-to-a-32-byte-minimum-secret!!}
    issuer: feature-flag-service
    admin-token-ttl: ${FF_ADMIN_TOKEN_TTL:PT8H}
    client-token-ttl: ${FF_CLIENT_TOKEN_TTL:PT15M}
    clients:                                          # consumer systems
      - client-id: order-service
        client-secret: ${FF_CLIENT_ORDER_SERVICE_SECRET:order-service-dev-secret}
        scopes: [flags:read]
  cors-allowed-origins: ${FF_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  require-https: ${FF_REQUIRE_HTTPS:false}
  cache:
    reconcile-cron: ${FF_CACHE_RECONCILE_CRON:0 0 3 * * *}
  audit:
    retention: ${FF_AUDIT_RETENTION:P365D}
    purge-cron: ${FF_AUDIT_PURGE_CRON:0 30 3 * * *}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    # Spec 9.2: request body max 65,536 bytes (BodySizeLimitFilter answers 413).
    max-http-form-post-size: 64KB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  writer-with-order-by-keys: true

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
  health:
    # Spec 9.3: only the db component is part of /actuator/health.
    diskspace:
      enabled: false
    ping:
      enabled: false
    ssl:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    git:
      mode: simple
  metrics:
    distribution:
      # Histogram buckets for the FFSlowEvaluation alert (p95 of /api/v1/evaluate/**).
      percentiles-histogram:
        http.server.requests: true
